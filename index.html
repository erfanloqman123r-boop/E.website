<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>E.website</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    background: #0b0b0b;
    color: white;
    font-family: Arial, sans-serif;
}

header {
    position: sticky;
    top: 0;
    z-index: 10;
    height: 70px;
    background: #151515;
    display: flex;
    align-items: center;
    gap: 20px;
    padding: 0 25px;
    border-bottom: 1px solid #292929;
}

.logo {
    font-size: 25px;
    font-weight: bold;
    white-space: nowrap;
}

.logo span {
    color: #ff1744;
}

.search {
    width: 100%;
    max-width: 450px;
    background: #242424;
    color: white;
    border: none;
    outline: none;
    border-radius: 25px;
    padding: 13px 18px;
    font-size: 15px;
}

.search::placeholder {
    color: #999;
}

.hero {
    padding: 45px 25px;
    background: linear-gradient(135deg, #181818, #090909);
}

.hero h1 {
    font-size: 42px;
    margin-bottom: 12px;
}

.hero p {
    color: #aaa;
    font-size: 17px;
    margin-bottom: 22px;
}

.hero button {
    background: #ff1744;
    color: white;
    border: none;
    padding: 13px 24px;
    border-radius: 7px;
    font-size: 16px;
    cursor: pointer;
}

.container {
    padding: 25px;
}

.section-title {
    font-size: 25px;
    margin: 30px 0 18px;
}

.player {
    background: black;
    width: 100%;
    max-width: 1000px;
    margin: auto;
    border-radius: 10px;
    overflow: hidden;
}

video {
    width: 100%;
    display: block;
    max-height: 550px;
}

.current-title {
    max-width: 1000px;
    margin: 15px auto;
    font-size: 22px;
}

.movies {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
    gap: 18px;
}

.movie {
    background: #171717;
    border-radius: 10px;
    overflow: hidden;
    cursor: pointer;
    transition: 0.2s;
}

.movie:hover {
    transform: translateY(-5px);
    background: #222;
}

.poster {
    height: 230px;
    background: linear-gradient(135deg, #292929, #111);
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 50px;
    color: #ff1744;
}

.movie-name {
    padding: 14px;
    font-weight: bold;
}

.category {
    display: flex;
    gap: 10px;
    overflow-x: auto;
    padding-bottom: 5px;
}

.category button {
    background: #202020;
    color: white;
    border: 1px solid #333;
    border-radius: 20px;
    padding: 9px 18px;
    cursor: pointer;
    white-space: nowrap;
}

.category button:hover {
    background: #ff1744;
}

footer {
    margin-top: 50px;
    padding: 25px;
    text-align: center;
    color: #777;
    background: #111;
}

@media (max-width: 600px) {

    header {
        height: auto;
        padding: 15px;
        flex-direction: column;
        align-items: stretch;
    }

    .logo {
        text-align: center;
    }

    .hero h1 {
        font-size: 30px;
    }

    .container {
        padding: 15px;
    }

    .movies {
        grid-template-columns: repeat(2, 1fr);
        gap: 12px;
    }

    .poster {
        height: 170px;
    }
}
</style>
</head>

    >
</header>

<section class="hero">

    <button onclick="scrollToMovies()">Browse Videos</button>

    <div class="category">

        <button onclick="filterMovies('demo')">Demo</button>
    </div>

        </video>
    </div>

        Select a video
