<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>E.website</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    background: #0b0b0b;
    color: white;
    font-family: Arial, sans-serif;
}

header {
    height: 65px;
    background: #151515;
    display: flex;
    align-items: center;
    padding: 0 20px;
    gap: 25px;
    position: sticky;
    top: 0;
    z-index: 10;
}

.logo {
    font-size: 24px;
    font-weight: bold;
    color: #20d66b;
}

.search {
    flex: 1;
    max-width: 500px;
    background: #252525;
    border: none;
    outline: none;
    padding: 12px 18px;
    border-radius: 25px;
    color: white;
    font-size: 15px;
}

.container {
    max-width: 1200px;
    margin: auto;
    padding: 20px;
}

.player {
    width: 100%;
    background: #000;
    aspect-ratio: 16 / 9;
    border-radius: 12px;
    overflow: hidden;
}

video {
    width: 100%;
    height: 100%;
    background: black;
}

.title {
    margin: 20px 0;
    font-size: 25px;
}

.section-title {
    margin: 30px 0 15px;
    font-size: 21px;
}

.movies {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
    gap: 15px;
}

.movie {
    background: #181818;
    border-radius: 10px;
    overflow: hidden;
    cursor: pointer;
    transition: 0.2s;
}

.movie:hover {
    transform: scale(1.03);
}

.poster {
    width: 100%;
    aspect-ratio: 2 / 3;
    background: linear-gradient(135deg,#222,#444);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 40px;
}

.movie-name {
    padding: 12px;
    font-weight: bold;
}

@media(max-width:600px) {
    header {
        padding: 0 12px;
    }

    .logo {
        font-size: 19px;
    }

    .container {
        padding: 12px;
    }

    .movies {
        grid-template-columns: repeat(2, 1fr);
    }
}
</style>
</head>

<body>

<header>
    <div class="logo">E.website</div>
    <input class="search" id="search" placeholder="Search movies...">
</header>

<div class="container">

    <div class="player">
        <video id="videoPlayer" controls>
            <source src="" type="video/mp4">
            Your browser does not support video.
        </video>
    </div>

    <h1 class="title" id="currentTitle">
        Select a movie
    </h1>

    <h2 class="section-title">Movies</h2>

    <div class="movies" id="movies">

        <div class="movie" data-name="Big Buck Bunny"
             onclick="playMovie('Big Buck Bunny','https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4')">
            <div class="poster">▶</div>
            <div class="movie-name">Big Buck Bunny</div>
        </div>

        <div class="movie" data-name="Elephants Dream"
             onclick="playMovie('Elephants Dream','https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ElephantsDream.mp4')">
            <div class="poster">▶</div>
            <div class="movie-name">Elephants Dream</div>
        </div>

        <div class="movie" data-name="For Bigger Blazes"
             onclick="playMovie('For Bigger Blazes','https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerBlazes.mp4')">
            <div class="poster">▶</div>
            <div class="movie-name">For Bigger Blazes</div>
        </div>

        <div class="movie" data-name="For Bigger Escape"
             onclick="playMovie('For Bigger Escape','https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerEscapes.mp4')">
            <div class="poster">▶</div>
            <div class="movie-name">For Bigger Escape</div>
        </div>

    </div>
</div>

<script>

function playMovie(title, url) {
    const video = document.getElementById("videoPlayer");

    video.src = url;
    document.getElementById("currentTitle").textContent = title;

    video.play();
}

document.getElementById("search").addEventListener("input", function() {

    const search = this.value.toLowerCase();
    const movies = document.querySelectorAll(".movie");

    movies.forEach(movie => {

        const name = movie.dataset.name.toLowerCase();

        if (name.includes(search)) {
            movie.style.display = "";
        } else {
            movie.style.display = "none";
        }

    });

});

</script>

</body>
</html>
